    <!-- Structured Data: Organization -->

      ],

        "availableLanguage": "English"

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How long does installation take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most residential installations are completed within 1–2 business days after your energy assessment. Our team handles everything from mounting the panels to configuring the inverter and batteries."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to pay upfront for the Monthly Plan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No! The Monthly Plan requires zero upfront payment. You simply pay a fixed monthly fee over 6, 12, or 24 months — all interest-free. At the end of your term, the system is fully yours."
          }
        },
        {
          "@type": "Question",
          "name": "What happens during cloudy or rainy days?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your system includes battery storage that stores excess energy generated during sunny hours. This stored energy powers your home during cloudy weather or at night, ensuring uninterrupted power."
          }
        },
        {
          "@type": "Question",
          "name": "What does quarterly maintenance include?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our technicians will inspect and clean your solar panels, check battery health, verify inverter performance, and ensure all wiring connections are optimal. This keeps your system running at peak efficiency."
          }
        },
        {
          "@type": "Question",
          "name": "Can I upgrade my system later?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. Our modular design lets you add more panels, batteries, or a larger inverter as your energy needs grow. We'll assess your usage and recommend the right upgrade path."
          }
        },
        {
          "@type": "Question",
          "name": "How does the Battery Cashback program work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "When your batteries reach the end of their lifecycle, we'll collect and recycle them responsibly. You receive a cashback credit towards your next battery purchase — good for your wallet and the environment."
          }
        },
        {
          "@type": "Question",
          "name": "What areas do you currently serve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We currently serve Lagos, Abuja, Ibadan, and Port Harcourt. We're rapidly expanding to more cities across Nigeria. Contact us to check availability in your area."
          }
        },
        {
          "@type": "Question",
          "name": "What's included in my energy assessment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A free, no-obligation assessment where our team evaluates your current energy usage, generator costs, roof suitability, and recommends the perfect system size and plan for your needs."
          }
        }
      ]
    }
    </script>
